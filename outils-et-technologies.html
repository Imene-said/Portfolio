<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Outils & Technologies — Imene</title>

<link rel="stylesheet" href="./assets/css/style.css">
<script defer src="./assets/js/main.js"></script>

<style>

/* ===== CONTAINER ===== */
.techContainer{
    max-width:1200px;
    margin:0 auto;
    padding:80px 20px 120px;
    text-align:center;
}

.techContainer h2{
    font-size:42px;
    color:#3b82f6;
    margin-bottom:10px;
}

.techContainer p{
    opacity:0.75;
    margin-bottom:60px;
    font-size:16px;
}

/* ===== BOUTON RETOUR ===== */
.backBtn{
    position:absolute;
    top:120px;
    left:40px;
    background:white;
    color:#0f172a;
    border:none;
    padding:8px 18px;
    border-radius:30px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}

.backBtn:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 20px rgba(255,255,255,0.3);
}

/* ===== GRID ===== */
.sectionGrid{
    display:flex;
    gap:40px;
    justify-content:center;
    flex-wrap:wrap;
}

/* ===== CARTES ===== */
.card{
    width:260px;
    height:260px;
    padding:25px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:22px;
    cursor:pointer;
    transition:0.35s;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    backdrop-filter: blur(6px);
}

.card:hover{
    transform:translateY(-10px);
    border-color:#3b82f6;
    box-shadow:0 20px 50px rgba(59,130,246,0.35);
}

.card img{
    width:150px;
    height:110px;
    object-fit:cover;
    border-radius:14px;
    margin-bottom:25px;
    transition:0.3s;
}

.card:hover img{
    transform:scale(1.05);
}

.card h4{
    margin:0;
    font-size:18px;
    font-weight:600;
}

/* ===== MODAL ===== */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:flex;
    justify-content:center;
    align-items:center;
    visibility:hidden;
    opacity:0;
    transition:0.3s;
    z-index:1000;
}

.modal.active{
    visibility:visible;
    opacity:1;
}

.modal-content{
    background:#0f172a;
    padding:40px;
    border-radius:20px;
    border:1px solid #3b82f6;
    width:90%;
    max-width:550px;
    text-align:center;
}

.modal-content img{
    width:100px;
    margin-bottom:20px;
}

.modal-content h2{
    margin-bottom:15px;
}

.modal-content p{
    opacity:0.85;
    line-height:1.6;
    font-size:15px;
}

.close{
    margin-top:25px;
    padding:10px 22px;
    border:none;
    background:#3b82f6;
    color:white;
    border-radius:10px;
    cursor:pointer;
}

</style>
</head>

<body class="page">

<div class="glow"></div>
<div class="gridlines"></div>
<canvas id="particles"></canvas>

<header>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div>
          <h1>Imene SAID ERRAHMANI</h1>
          <p>Portfolio BUT R&T — Alternance</p>
        </div>
      </div>

      <nav>
        <a class="navlink" href="./index.html">Accueil</a>
        <a class="navlink active" href="./cv.html">About</a>
        <a class="navlink" href="./pro.html">Projets professionnels</a>
        <a class="navlink" href="./cours.html">Apprentissage</a>
        <a class="navlink" href="./faq.html">FAQ</a>
        <a class="navlink" href="./contact.html">Contact</a>
      </nav>
    </div>
  </div>
</header>

<button class="backBtn" onclick="history.back()">← Retour</button>

<main class="techContainer">

<h2>Outils & Technologies</h2>
<p></p>

<div class="sectionGrid">

<div class="card" data-title="Wireshark"
data-description="Analyse avancée du trafic réseau, capture de paquets et diagnostic réseau.">
<img src="assets/img/outils-et-technologies/wireshark.png">
<h4>Wireshark</h4>
</div>

<div class="card" data-title="Sécurité"
data-description="Configuration Cisco ASA, ACL, VPN, tunnels GRE/IPsec et sécurisation d'infrastructure.">
<img src="assets/img/outils-et-technologies/securite.png">
<h4>Sécurité</h4>
</div>

<div class="card" data-title="Pentest"
data-description="Audit de sécurité, scan de ports, MITM, utilisation de Metasploit et outils offensifs.">
<img src="assets/img/outils-et-technologies/pentest.png">
<h4>Pentest</h4>
</div>

<div class="card" data-title="Développement"
data-description="Développement Python, HTML/CSS et scripts d’automatisation.">
<img src="assets/img/outils-et-technologies/dev.png">
<h4>Développement</h4>
</div>

<div class="card" data-title="Systèmes"
data-description="Administration Windows Server, Active Directory, Linux, DNS et DHCP.">
<img src="assets/img/outils-et-technologies/system.png">
<h4>Systèmes</h4>
</div>

<div class="card" data-title="Infrastructure"
data-description="Configuration switch Juniper, borne WiFi Aruba et architecture réseau professionnelle.">
<img src="assets/img/outils-et-technologies/reseau.png">
<h4>Infrastructure</h4>
</div>

</div>

</main>

<div class="modal" id="modal">
<div class="modal-content">
<img id="modal-img">
<h2 id="modal-title"></h2>
<p id="modal-desc"></p>
<button class="close" onclick="closeModal()">Fermer</button>
</div>
</div>

<script>
const cards=document.querySelectorAll(".card");
const modal=document.getElementById("modal");
const modalTitle=document.getElementById("modal-title");
const modalDesc=document.getElementById("modal-desc");
const modalImg=document.getElementById("modal-img");

cards.forEach(card=>{
card.addEventListener("click",()=>{
modal.classList.add("active");
modalTitle.textContent=card.dataset.title;
modalDesc.textContent=card.dataset.description;
modalImg.src=card.querySelector("img").src;
});
});

function closeModal(){
modal.classList.remove("active");
}

modal.addEventListener("click",(e)=>{
if(e.target===modal){
closeModal();
}
});
</script>

</body>
</html>
