  <!-- SCRIPT TYPING BONJOUR -->
  <script>
    const text = "Bonjour, je suis Imene.";
    const speed = 52;

    const el = document.getElementById("type");
    let i = 0;

    function typeWriter() {
      if (i < text.length) {
        el.textContent += text.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
      } else {
        el.classList.remove("cursor");
      }
    }

    typeWriter();
  </script>

  <!-- SCRIPT TEXTE DYNAMIQUE -->
  <script>
    const phrases = [
      "Construire. Déployer. Sécuriser.",
      "Étudiante en BUT Réseaux & Télécommunications.",
      "Découvrez mes projets et mon expérience en alternance."
    ];
    
    let phraseIndex = 0;
    let letterIndex = 0;
    let isDeleting = false;
    
    const speedWrite = 50;
    const speedDelete = 30;
    const pauseTime = 2000;
    
    const textElement = document.getElementById("text");
    
    function typeEffect() {
      const fullText = phrases[phraseIndex];
    
      if (!isDeleting) {
        textElement.textContent = fullText.substring(0, letterIndex++);
        
        if (letterIndex > fullText.length) {
          isDeleting = true;
          setTimeout(typeEffect, pauseTime);
          return;
        }
        setTimeout(typeEffect, speedWrite);
    
      } else {
        textElement.textContent = fullText.substring(0, letterIndex--);
    
        if (letterIndex < 0) {
          isDeleting = false;
          phraseIndex = (phraseIndex + 1) % phrases.length;
          setTimeout(typeEffect, 500);
          return;
        }
        setTimeout(typeEffect, speedDelete);
      }
    }
    
    typeEffect();
  </script>

  <script src="./assets/js/main.js"></script>
