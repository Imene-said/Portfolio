  <section class="heroFull">
    <div class="container">
      <!--<div class="glass" style="max-width:980px;margin:0 auto;">-->
        <div class="inner">
          <h2><span id="type" class="cursor"></span></h2>
          <p><span id="text" class="cursor sub"></span></p>
      </div>
    </div>

  </section>

  <script>
    const text = "Bonjour, je suis Imene.";
    const speed = 52; // ms par caractère (plus petit = plus rapide)

    const el = document.getElementById("type");
    let i = 0;

    function typeWriter() {
      if (i < text.length) {
        el.textContent += text.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
      } else {
        // optionnel : enlever le curseur à la fin
         el.classList.remove("cursor");
      }
    }

    typeWriter();
  </script>
  <script>
    const phrases = [
      "Je suis étudiante en 3ème année en BUT Réseaux et Telecommunications à l'IUT de Béthune.",
      "Je suis Alternante",
    ];
    
    let phraseIndex = 0;
    let letterIndex = 0;
    let isDeleting = false;
    
    const speedWrite = 50;   // vitesse d'écriture
    const speedDelete = 30;  // vitesse d'effacement
    const pauseTime = 2000;  // temps d'affichage avant disparition
    
    const textElement = document.getElementById("text"); // ID de ton élément
    
    function typeEffect() {
      const fullText = phrases[phraseIndex];
    
      if (!isDeleting) {
        textElement.textContent = fullText.substring(0, letterIndex++);
        
        if (letterIndex > fullText.length) {
          isDeleting = true;
          setTimeout(typeEffect, pauseTime);
          return;
        }
        setTimeout(typeEffect, speedWrite);
    
      } else {
        textElement.textContent = fullText.substring(0, letterIndex--);
    
        if (letterIndex < 0) {
          isDeleting = false;
          phraseIndex = (phraseIndex + 1) % phrases.length;
          setTimeout(typeEffect, 500);
          return;
        }
        setTimeout(typeEffect, speedDelete);
      }
    }
    
    typeEffect();
    </script>

  <script src="./assets/js/main.js"></script>
